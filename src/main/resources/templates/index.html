<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Counsellor Portal - Sign In</title>
	
	<!-- Google Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	
	<!-- Bootstrap 5.3.3 CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	
	<!-- Bootstrap Icons -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
	
	<!-- Custom Design System -->
	<link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>

<body>

	<div class="cp-auth-wrapper">
		<div class="cp-auth-card">
			<div class="cp-auth-header">
				<div class="cp-auth-logo">
					<i class="bi bi-mortarboard-fill"></i>
				</div>
				<h2 class="cp-auth-title">Welcome Back</h2>
				<p class="cp-auth-subtitle">Sign in to your Counsellor Portal</p>
			</div>

			<div class="cp-auth-body">
				<!-- Error Alert -->
				<div th:if="${emsg}" class="cp-alert cp-alert-danger" role="alert">
					<i class="bi bi-exclamation-triangle-fill cp-alert-icon"></i>
					<div>
						<strong>Authentication Failed</strong>
						<p class="mb-0 small" th:text="${emsg}"></p>
					</div>
				</div>

				<form th:action="@{/login}" th:object="${counsellor}" method="post">
					<div class="mb-3">
						<label class="cp-form-label" for="email">
							<i class="bi bi-envelope"></i> Email Address
						</label>
						<div class="cp-input-group">
							<i class="bi bi-envelope cp-input-icon"></i>
							<input type="email" id="email" th:field="*{email}" class="form-control"
								placeholder="counsellor@example.com" required autocomplete="email">
						</div>
					</div>

					<div class="mb-4">
						<label class="cp-form-label" for="pwd">
							<i class="bi bi-lock"></i> Password
						</label>
						<div class="cp-input-group">
							<i class="bi bi-lock cp-input-icon"></i>
							<input type="password" id="pwd" th:field="*{pwd}" class="form-control"
								placeholder="Enter your password" required autocomplete="current-password">
						</div>
					</div>

					<button type="submit" class="btn btn-primary w-100 btn-lg mb-2">
						<i class="bi bi-box-arrow-in-right"></i> Sign In
					</button>
				</form>
			</div>

			<div class="cp-auth-footer">
				Don't have an account yet? 
				<a href="register" class="fw-semibold">
					Register here <i class="bi bi-arrow-right-short"></i>
				</a>
			</div>
		</div>
	</div>

	<!-- Bootstrap Bundle JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
